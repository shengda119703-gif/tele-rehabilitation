/* V1.1 — 记录与更正分屏，去重后的信息层级 */
.history-overview{margin:0 0 13px;display:flex;justify-content:space-between;align-items:center;gap:10px}

  const audit=(selected?state.audit.filter(a=>a.medId===selected):state.audit).slice().reverse();
  const viewMode=state.historyTab||'records';
  const dates=[...new Set(records.map(r=>r.date))].sort().reverse();
  const statusCls=s=>s==='taken'?'taken':s==='skipped'?'skipped':'unrecorded';
  const list=dates.map(date=>{
    const dayRecords=records.filter(r=>r.date===date).sort((a,b)=>a.time.localeCompare(b.time));
    return `<section class="history-group"><div class="history-date"><strong>${date===today?'今天 · ':date===addDays(today,-1)?'昨天 · ':''}${zh(date)}</strong><small>${dayRecords.length} 项</small></div><div class="history-card">${dayRecords.map(r=>`<button class="history-entry" onclick="APP.openLog('${r.medId}','${r.date}','${r.time}')"><span class="h-time">${esc(r.time)}</span><span class="h-info"><span class="h-name">${esc(r.nameSnapshot)}</span><span class="h-dose">${esc(r.doseSnapshot||'未填写剂量')}</span></span><span class="h-end"><span class="h-status ${statusCls(r.status)}">${statusName(r.status)}</span><span class="h-chevron">›</span></span></button>`).join('')}</div></section>`;
  }).join('');
  const auditList=audit.map(a=>`<div class="audit-row"><span class="audit-dot"></span><span class="audit-copy"><b>${esc(a.nameSnapshot)}</b><small>${zh(a.date)} ${esc(a.time)} · ${statusName(a.previous)} → ${statusName(a.status)}</small></span><time>${esc(a.savedAt)}</time></div>`).join('');
  return `<main class="page">${header('服药记录')}<div class="history-overview"><div class="history-summary"><b>${viewMode==='audit'?audit.length:records.length}</b>${viewMode==='audit'?'次状态变更':'条状态记录'}</div></div><div class="history-tabs" role="tablist" aria-label="记录类型"><button role="tab" aria-selected="${viewMode==='records'}" class="${viewMode==='records'?'active':''}" onclick="APP.historyTab('records')">服药记录</button><button role="tab" aria-selected="${viewMode==='audit'}" class="${viewMode==='audit'?'active':''}" onclick="APP.historyTab('audit')">更正历史</button></div><div class="history-tools"><select aria-label="筛选药物" onchange="APP.historyFor(this.value)"><option value="" ${!selected?'selected':''}>全部药物</option>${state.meds.map(m=>`<option value="${esc(m.id)}" ${m.id===selected?'selected':''}>${esc(m.name)}</option>`).join('')}</select><span class="hint">${viewMode==='records'?'按计划日期查看':'按登记时间查看'}</span></div>${viewMode==='records'?(list||'<div class="panel empty">暂无状态记录</div>'):(`<div class="audit-card">${auditList||'<div class="empty" style="padding:26px">暂无状态变更</div>'}</div>`)}<p class="history-note">未记录不代表漏服。记录仅代表用户登记，不是自动检测结果。</p></main>`
}
function search(){const q=state.search.toLowerCase(),results=state.meds.filter(m=>m.name.toLowerCase().includes(q));return `<main class="page">${header('搜索药物')}<input class="searchInput" type="search" placeholder="搜索已保存的药品名称" value="${esc(state.search)}" oninput="APP.search(this.value)"><div class="stack" style="margin-top:14px">${results.length?results.map(m=>`<button class="medRow" onclick="APP.openMed('${m.id}')"><div class="txt"><b>${esc(m.name)}</b><small>${esc(m.dose)} · ${m.status==='active'?'在用':'已停用'}</small></div><span class="chev">›</span></button>`).join(''):'<div class="empty">未找到已保存的药物</div>'}</div></main>`}
function settings(){return `<main class="page">${header('演示状态')}<div class="panel"><h3>界面状态切换</h3><p class="sub">仅供检查交互，不影响真实项目。</p>${[['normal','正常（演示记录）'],['empty','空药品状态'],['offline','服务断连'],['unpaired','未配对档案']].map(([v,t])=>`<button class="switchRow" style="width:100%;border:0;border-bottom:1px solid #edf0ea;background:transparent;text-align:left" onclick="APP.scenario('${v}')"><span>${t}</span><span>${state.scenario===v?'●':'›'}</span></button>`).join('')}<div class="switchRow">模拟下一次保存失败 <input type="checkbox" ${state.failNext?'checked':''} onchange="APP.failNext(this.checked)"></div></div><button class="btn outline full" onclick="APP.reset()">重置演示数据</button></main>`}
function assistant(){return `<main class="page">${header('AI 助手')}<div class="chatBox">可以对预填问题进行修改。此独立原型未连接 AI 服务，也不会发送药物信息。</div><div class="panel" style="margin-top:18px"><label style="display:block;font-size:12px;font-weight:750;margin-bottom:8px">你的问题</label><textarea id="aiQuestion" style="width:100%;min-height:100px;border:1px solid #e1e7dd;border-radius:12px;padding:12px" oninput="APP.aiDraft(this.value)">${esc(state.aiText)}</textarea><button class="btn primary full" style="margin-top:12px" onclick="APP.aiSend()">发送</button></div></main>`}
function modal(){if(state.modal!=='stop')return '';let m=med(state.selectedMed);return `<div class="sheetBack" role="presentation" onclick="APP.closeModal(event)"><div class="sheet" role="dialog" aria-modal="true"><h3>${m?.status==='active'?'标记停用':'恢复在用'}？</h3><p class="sub">只更改药品记录状态，不删除已登记历史。此操作不代表医生调整治疗方案。</p><div class="btnrow" style="margin-top:18px"><button class="btn outline" onclick="APP.modal('')">取消</button><button class="btn dark" onclick="APP.toggleStatus()">确认</button></div></div></div>`};

function heroSelection(){const rs=doses(state.day);if(!rs.length)return 0;return state.heroDoseIndex!=null&&state.heroDoseIndex>=0&&state.heroDoseIndex<rs.length?state.heroDoseIndex:Math.max(0,rs.findIndex(r=>r.status==='unrecorded'))}
let heroWheelLast=0;
function bindHeroGesture(){
 const el=document.getElementById('doseSwipe'),slide=document.getElementById('doseSwipeContent');if(!el||!slide)return;
 let down=null;
 const reset=()=>{slide.style.transform='translateX(0px)';slide.style.opacity='1'};
 const step=(direction)=>{const before=heroSelection(),count=doses(state.day).length;
   if(direction===0||before+direction<0||before+direction>=count){reset();return}
   state.heroDoseIndex=before+direction;const pos=view.scrollTop;render();view.scrollTop=pos;};
 el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;down={x:e.clientX,y:e.clientY,id:e.pointerId,move:0};if(el.setPointerCapture)try{el.setPointerCapture(e.pointerId)}catch(_){} });
 el.addEventListener('pointermove',e=>{if(!down||down.id!==e.pointerId)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)>Math.abs(dy)+8){down.move=dx;slide.style.transition='none';slide.style.transform=`translateX(${Math.max(-42,Math.min(42,dx*.35))}px)`;slide.style.opacity='.95';}});
 const end=e=>{if(!down||down.id!==e.pointerId)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;slide.style.transition='transform .18s ease';if(Math.abs(dx)>=35&&Math.abs(dx)>Math.abs(dy)*1.1){step(dx<0?1:-1)}else reset()};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{down=null;reset()});
 el.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();step(e.key==='ArrowRight'?1:-1)}});
 el.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<12||Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;e.preventDefault();const now=performance.now();if(now-heroWheelLast>580){heroWheelLast=now;step(e.deltaX>0?1:-1)}},{passive:false});
}
function render(){if(state.scenario==='empty'&&state.page==='home'){const copy=state.meds; /* visual mode handled below */}const pages={home,meds,medDetail,newMed:()=>medForm(true),editMed:()=>medForm(false),timesPage,logPage,history,search,settings,assistant};view.innerHTML=(pages[state.page]||home)();bottom();overlay.innerHTML=modal();if(state.page==='home')bindHeroGesture()};
const APP={go(page){if(page==='newMed'){state.form={name:'',dose:'',purpose:'',notes:''};state.formError='';}navigate(page)},back,day(n){let d=addDays(state.day,n);if(d>today)return;state.day=d;state.heroDoseIndex=null;render()},setDay(v){if(v&&v<=today){state.day=v;state.heroDoseIndex=null;render()}},heroStep(n){const pos=view.scrollTop,count=doses(state.day).length,to=heroSelection()+n;if(to>=0&&to<count){state.heroDoseIndex=to;render();view.scrollTop=pos}},heroSelect(i,scrollTop=false){const pos=view.scrollTop;state.heroDoseIndex=i;render();view.scrollTop=scrollTop?0:pos},tab(s){if(s==='用药'){state.page='home';state.stack=[];state.day=today;state.heroDoseIndex=null;render();return;}popup(`${s}栏目由正式项目提供，此原型未接入。`)},openMed(id){state.selectedMed=id;navigate('medDetail')},editMed(id){const m=med(id);state.selectedMed=id;state.form={name:m.name,dose:m.dose,purpose:m.purpose,notes:m.notes};navigate('editMed')},field(k,v){state.form[k]=v;state.formError=''},addTime(){const t=state.plannedTime;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)){state.formError='时间请使用 HH:mm，例如 08:00。';render();return}if(state.form.times.includes(t)){state.formError='该时间已存在。';render();return}if(state.form.times.length>=12){state.formError='最多可设置 12 个时间。';render();return}state.form.times=[...state.form.times,t].sort();state.plannedTime='';state.formError='';render()},delTime(i){state.form.times.splice(i,1);render()},setTimeDraft(v){state.plannedTime=v},times(id){let m=med(id);state.selectedMed=id;state.form={times:[...m.times],start:m.start||today,end:m.end||''};state.plannedTime='';navigate('timesPage')},saveTimes(){let f=state.form;if(!f.times.length){state.formError='至少设置一个服用时间。';render();return}if(!f.start||!/^\d{4}-\d\d-\d\d$/.test(f.start)||f.end&&f.end<f.start){state.formError='请检查开始与结束日期。';render();return}if(state.failNext){state.failNext=false;state.formError='模拟断连：时间未保存，请核对网络后再试。';render();return}const m=med(state.selectedMed);if(!m||m.status!=='active'){state.formError='只有在用药物可以保存时间安排。';render();return}m.times=[...f.times];m.start=f.start;m.end=f.end;back();popup('时间安排已保存（演示）')},saveMed(){let f=state.form;if(!f.name?.trim()||f.name.trim().length>100){state.formError='请填写药物名称（不超过100字）。';render();return}if(state.failNext){state.failNext=false;state.formError='模拟失败：药物资料未保存，输入已保留。';render();return}if(state.page==='newMed'){let m={id:'m'+(++counter),name:f.name.trim(),dose:(f.dose||'').trim(),purpose:(f.purpose||'').trim(),notes:(f.notes||'').trim(),status:'active',times:[],start:today,end:''};state.meds.push(m);state.selectedMed=m.id;state.stack.pop();state.page='medDetail';state.stack.push({page:'meds',scroll:0,day:state.day,selectedMed:m.id});render();popup('药品已保存，服用时间尚未设置');}else {let m=med(state.selectedMed);Object.assign(m,{name:f.name.trim(),dose:(f.dose||'').trim(),purpose:(f.purpose||'').trim(),notes:(f.notes||'').trim()});back();popup('药品资料已保存（演示）')}},openLog(id,date,time){state.logKey={medId:id,date,time};state.draftStatus=null;state.formError='';navigate('logPage')},draftStatus(s){state.draftStatus=s;state.formError='';render()},saveLog(){const {medId,date,time}=state.logKey||{};if(!state.draftStatus){state.formError='请先选择实际登记状态。';render();return}if(date>today){state.formError='未来日期不能登记。';render();return}if(state.failNext){state.failNext=false;state.formError='模拟保存失败：本次没有保存，请先核对历史记录。';render();return}let k=key(medId,date,time),previous=state.doses[k],m=med(medId);if(!previous&&!activeFor(m,date)&&!m?.times.includes(time)){state.formError='该时段不属于当前有效安排。';render();return}let now=new Date(),savedAt=`${localToday()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;let x={medId,date,time,status:state.draftStatus,nameSnapshot:previous?.nameSnapshot||m.name,doseSnapshot:previous?.doseSnapshot||m.dose,savedAt};state.doses[k]=x;state.audit.push({...x,previous:previous?.status||'unrecorded'});const wasHome=state.stack.length&&state.stack[state.stack.length-1].page==='home';back();if(wasHome){state.heroDoseIndex=null;render()}popup('登记已保存（演示）')},confirmStatus(id){state.selectedMed=id;state.modal='stop';overlay.innerHTML=modal()},modal(v){state.modal=v;overlay.innerHTML=modal()},closeModal(e){if(e.target.classList.contains('sheetBack'))APP.modal('')},toggleStatus(){let m=med(state.selectedMed);m.status=m.status==='active'?'stopped':'active';state.modal='';render();popup('药物状态已更新（演示）')},historyFor(id){state.selectedMedFilter=id;if(state.page!=='history'){state.historyTab='records';navigate('history')}else{render();view.scrollTop=0}},historyTab(which){state.historyTab=which;render();view.scrollTop=0},search(q){state.search=q;let pos=view.scrollTop;render();view.scrollTop=pos;const el=$('.searchInput');if(el){el.focus();el.setSelectionRange(q.length,q.length)}},scenario(v){if(v==='empty'){state.meds=[];state.doses={};state.audit=[];v='normal';}state.scenario=v;state.page='home';state.stack=[];state.heroDoseIndex=null;render();view.scrollTop=0},failNext(v){state.failNext=v},reset(){location.reload()},ai(origin){state.aiText=origin==='med'?`关于「${med(state.selectedMed)?.name||'这条药物记录'}」，我应该怎样理解已经填写的服用说明？`:'请解释如何理解服药记录中的“已服用”“已跳过”和“未记录”？';navigate('assistant')},aiDraft(v){state.aiText=v},aiSend(){popup('演示页面未连接 AI，问题未发送。')}};window.APP=APP;render();})();
</script></body></html>
