const state={carouselIndex:0,page:'home',stack:[],metric:'walkSpeed',metricFilter:'all',scenario:'full',profile:{name:'TEST 林女士',age:'68',conditions:'高血压、腰背部僵硬（合成演示）'},documents:[{id:'a1',name:'身体信息摘要',category:'其他资料',type:'TXT',size:'0.2 KB',date:'10月12日 21:33',trash:false},{id:'a2',name:'康复评估与训练汇总',category:'其他资料',type:'TXT',size:'0.3 KB',date:'10月12日 21:33',trash:false},{id:'a3',name:'目前用药清单',category:'病历资料',type:'TXT',size:'0.2 KB',date:'10月12日 21:33',trash:false}],fileId:'a1',uploadFile:null,formMetric:'weight',formDraft:'',formError:'',formStatus:'',savedToast:false,profileError:'',aiDraft:'',aiReplies:[],aiPrivate:false,assistantOrigin:'home',searchQ:'',tab:'all',archiveTab:'active',showHistory:false,pointIndex:null,modal:'',filterEdit:'',reportTab:'health',selectedDate:null};

let carouselGesture=null;

let lastWheelMove=0;

function slideTo(i){
 const index=Math.max(0,Math.min(9,Math.round(Number(i)||0)));
 state.carouselIndex=index;
 const t=document.getElementById('health-card-track');
 if(t){t.style.transition='';t.style.transform=`translate3d(-${index*100}%,0,0)`;}
 const p=document.getElementById('health-progress');
 if(p)p.querySelectorAll('.health-progress-cell').forEach((b,j)=>{b.classList.toggle('active',j===index);b.setAttribute('aria-current',j===index?'true':'false')});
 if(t)t.querySelectorAll('.health-slide').forEach((el,j)=>{el.setAttribute('aria-hidden',j===index?'false':'true');el.querySelectorAll('button').forEach(btn=>btn.tabIndex=j===index?0:-1)});
}
function sliderDown(e){
 if(e.pointerType!=='mouse'||e.button!==0)return;
 if(e.target.closest('button'))return;
 carouselGesture={x:e.clientX,y:e.clientY,at:state.carouselIndex,id:e.pointerId};
 try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
}
function sliderMove(e){
 const d=carouselGesture;if(!d||d.id!==e.pointerId)return;
 const dx=e.clientX-d.x,dy=e.clientY-d.y;
 if(Math.abs(dx)<=3||Math.abs(dx)<Math.abs(dy))return;
 const t=document.getElementById('health-card-track');
 if(t){t.style.transition='none';t.style.transform=`translate3d(calc(-${d.at*100}% + ${Math.max(-84,Math.min(84,dx*.65))}px),0,0)`;}
}
function sliderUp(e){
 const d=carouselGesture;if(!d||d.id!==e.pointerId)return;
 carouselGesture=null;
 const dx=e.clientX-d.x,dy=e.clientY-d.y;
 if(Math.abs(dx)>=34&&Math.abs(dx)>Math.abs(dy)*1.05){preventSwipeClickUntil=performance.now()+160;slideTo(d.at+(dx<0?1:-1))}
 else slideTo(d.at);
}
function sliderCancel(){carouselGesture=null;slideTo(state.carouselIndex)}
function touchStart(e){
 if(e.touches.length!==1)return;
 const t=e.touches[0];touchGesture={x:t.clientX,y:t.clientY,at:state.carouselIndex,dragged:false};

function touchMove(e){
 const d=touchGesture;if(!d||e.touches.length!==1)return;

 if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)*1.15){
  if(e.cancelable)e.preventDefault();
  d.dragged=true;
  const track=document.getElementById('health-card-track');
  if(track){track.style.transition='none';track.style.transform=`translate3d(calc(-${d.at*100}% + ${Math.max(-75,Math.min(75,dx*.6))}px),0,0)`}
 }
}
function touchEnd(e){

  preventSwipeClickUntil=performance.now()+220;
  if(e.cancelable)e.preventDefault();

 }else slideTo(d.at);
}
