name: Workbench contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ankang_cloud_qa
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLOUD_TEST_DATABASE_URL: postgresql+psycopg://qa:synthetic-ci-only@127.0.0.1:5432/ankang_cloud_qa
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cloud_service/requirements.txt pytest==9.1.1 httpx==0.28.1
      - run: python -m pytest cloud_service/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test public_web/browser-account.test.cjs tools/cloud/portal.test.cjs

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ankang/route1-health-agent/package-lock.json
      - run: npm ci --prefix ankang/route1-health-agent
      - run: npm run ci --prefix ankang/route1-health-agent
