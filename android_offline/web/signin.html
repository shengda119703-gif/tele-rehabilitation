<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9f6"><title>登录安康</title><link rel="stylesheet" href="/local/signin.css"><script src="/local/store.js" defer></script><script src="/local/account.js" defer></script><script src="/local/signin.js" defer></script></head>
<body><main class="signin"><div class="signin-mark" aria-hidden="true">安</div><h1>欢迎来到安康</h1><p class="signin-subtitle">登录，继续你的康复生活</p><div class="signin-tabs" aria-label="账号操作"><button type="button" id="signin-mode" aria-pressed="true">登录</button><button type="button" id="register-mode" aria-pressed="false">注册账号</button></div><form id="signin-form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="输入账号" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="输入密码" required><p id="signin-status" role="status" aria-live="polite"></p><button type="submit" id="signin-submit">登录</button></form><button type="button" id="signin-offline" hidden>使用已登录账号离线进入</button><p class="signin-footer">本机记录会保留，登录不会清空资料</p></main></body></html>
